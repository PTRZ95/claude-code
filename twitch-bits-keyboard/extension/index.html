<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Troll - Bits Extension</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h2>Keyboard Troll</h2>
    <p class="subtitle">100 Bits = 1 Tastendruck beim Streamer!</p>

    <div id="cooldown-banner" class="hidden">
      <span id="cooldown-text">Cooldown: <span id="cooldown-timer">0</span>s</span>
    </div>

    <div id="key-grid"></div>

    <div id="status" class="hidden"></div>
  </div>

  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
