<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Glass Clock Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  .glass-container {
    position: relative;
    padding: 24px 40px;
    border-radius: 28px;
    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.18) 0%,
      rgba(255, 255, 255, 0.06) 40%,
      rgba(255, 255, 255, 0.12) 100%
    );
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.4),
      inset 0 -1px 0 rgba(255, 255, 255, 0.1),
      0 0 0 0.5px rgba(255, 255, 255, 0.2);
    overflow: hidden;
    animation: floatIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(10px) scale(0.97);
  }

  @keyframes floatIn {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* Specular highlight — top edge shine */
  .glass-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 50%;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.35) 0%,
      rgba(255, 255, 255, 0.08) 40%,
      transparent 100%
    );
    border-radius: 28px 28px 50% 50%;
    pointer-events: none;
  }

  /* Soft refraction edge glow */
  .glass-container::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 29px;
    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.25) 0%,
      transparent 30%,
      transparent 70%,
      rgba(255, 255, 255, 0.15) 100%
    );
    pointer-events: none;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    padding: 1px;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .time {
    font-size: 56px;
    font-weight: 300;
    letter-spacing: -1px;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    line-height: 1.1;
  }

  .time .seconds {
    font-size: 28px;
    font-weight: 400;
    opacity: 0.6;
    vertical-align: super;
    margin-left: 2px;
  }

  .separator {
    width: 40px;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.4),
      transparent
    );
    margin: 10px auto;
  }

  .date {
    font-size: 16px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.7);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    letter-spacing: 0.5px;
    text-transform: capitalize;
  }

  /* Subtle pulse animation on the glass */
  .shimmer {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(
      ellipse at 30% 20%,
      rgba(255, 255, 255, 0.06) 0%,
      transparent 60%
    );
    animation: shimmer 8s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes shimmer {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(5%, 3%) rotate(2deg); }
  }
</style>
</head>
<body>

<div class="glass-container">
  <div class="shimmer"></div>
  <div class="content">
    <div class="time" id="time">00:00<span class="seconds">00</span></div>
    <div class="separator"></div>
    <div class="date" id="date">Montag, 1. Januar 2026</div>
  </div>
</div>

<script>
  const WEEKDAYS = [
    'Sonntag', 'Montag', 'Dienstag', 'Mittwoch',
    'Donnerstag', 'Freitag', 'Samstag'
  ];
  const MONTHS = [
    'Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
    'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'
  ];

  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');

  function pad(n) {
    return n.toString().padStart(2, '0');
  }

  function update() {
    const now = new Date();

    const h = pad(now.getHours());
    const m = pad(now.getMinutes());
    const s = pad(now.getSeconds());

    timeEl.innerHTML = `${h}:${m}<span class="seconds">${s}</span>`;

    const weekday = WEEKDAYS[now.getDay()];
    const day = now.getDate();
    const month = MONTHS[now.getMonth()];
    const year = now.getFullYear();

    dateEl.textContent = `${weekday}, ${day}. ${month} ${year}`;
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
